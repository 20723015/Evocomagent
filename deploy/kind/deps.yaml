spec:
  replicas: 1
  selector: {matchLabels: {app: commerce}}
  template:
    metadata: {labels: {app: commerce}}
    spec:
      containers:
        - name: commerce
          image: ecom-fake-services:kind
          command: ["python", "-m", "fake_commerce"]
          ports: [{containerPort: 8080}]
