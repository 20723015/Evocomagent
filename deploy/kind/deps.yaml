# 临时调试 Pod（可选）：SQL/ES/MinIO 探活
apiVersion: v1
kind: Pod
metadata: {name: ecom-smoke, labels: {app: ecom-deps}}
spec:
  containers:
    - name: smoke
      image: curlimages/curl:latest
