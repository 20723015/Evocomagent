{{- if and .Values.humanPublishWorker.enabled .Values.humanPublishWorker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-human-publish
  labels:
    app: ecom-agent-human-publish
spec:
  minAvailable: {{ .Values.humanPublishWorker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: ecom-agent-human-publish
{{- end }}
