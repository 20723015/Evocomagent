{{- if and .Values.kbWorker.enabled .Values.kbWorker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-kb-worker
  labels:
    app: ecom-agent-kb-worker
spec:
  minAvailable: {{ .Values.kbWorker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: ecom-agent-kb-worker
{{- end }}
