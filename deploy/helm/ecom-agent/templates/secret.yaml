# 密钥不进 Chart 值、不进镜像——由运维在集群中另行提供：
#   kubectl create secret generic ecom-agent-secrets \
#     --from-literal=OPENAI_API_KEY=sk-xxx \
#     --from-literal=OPENAI_BASE_URL=https://api.openai.com/v1 \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=COMMERCE_API_KEY=...
#
# 4.1：默认 secret.create=false（不创建 REPLACE_ME 占位——部署必填 existingSecret）。
# 开发/kind 环境可设置 secret.create=true 并填 secret.data。
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.envFromSecret }}
type: Opaque
stringData:
  {{- toYaml .Values.secret.data | nindent 2 }}
{{- end }}