# 4.1 生产覆盖（helm install -f values-production.yaml）
# 全部生产默认：ES 检索 + hybrid + reranker、Redis 必需、鉴权/归属/退款确认/
# OPS RBAC 全开、对象存储分片与原件、自进化关闭（人工审核）。

replicaCount: 3

image:
  repository: registry.example.com/ecom-agent
  tag: "0.2.0"
  pullPolicy: IfNotPresent

env:
  # ---- 被测模型（真实评测走外部配置）----
  MODEL_NAME: DeepSeek-V4-Flash-0731
  MEMORY_ENABLED: "true"
  # 记忆 PII 口径（批次4·统一脱敏+业务例外）：手机号等直接 PII 入库前
  # 脱敏为占位符；姓名/收货地址为客服业务必需 PII，保留入库，依赖
  # 存储访问控制（MEMORY_DIR 卷挂载权限/DB 账号隔离）保护，不入 prompt 之外的导出通道
  # ---- 检索：ES hybrid + bge-reranker（唯一生产基线）----
  RAG_BACKEND: es
  RAG_HYBRID: "true"
  RAG_HYBRID_RECALL_K: "60"
  RAG_RERANK: bge-reranker-v2-m3
  # ---- Embedding：SophNet EasyLLM bge-m3（1024 维，与索引 _meta 一致）----
  EMBEDDING_PROVIDER: sophnet
  EMBEDDING_MODEL: bge-m3
  SOPHNET_EMBEDDING_DIMENSIONS: "1024"
  # SOPHNET_EMBEDDING_URL / SOPHNET_EASYLLM_ID / SOPHNET_API_KEY 由部署环境
  # 经 values 覆盖或 envFromSecret 提供；缺失时 /readyz 的 rag 能力为
  # unavailable（chat 503 fail-closed），不会静默降级。
  # RAG 修复计划·1：精排不可用时生产 fail-closed（禁止未验证证据回答）
  RAG_RERANK_FAIL_CLOSED: "true"
  # RAG 修复计划·4：生产强制文档治理（缺失/非法元数据构建即失败）
  RAG_DOC_METADATA_REQUIRED: "true"
  # RAG 修复计划·3：旧校准阈值已删除（文档治理+重建 generation 后重新校准，
  # 再把生成值写入此处；未配置=不门控）。
  # RAG 修复计划·5：发布激活开关——与重校准阈值同时写入（发布顺序第 4–5 步）；
  # 未激活时 /readyz 的 rag 能力对 prod 缺阈值仍返回 503。
  RAG_RELEASE_ACTIVATED: "false"
  # RAG_MIN_RELEVANCE_SCORE: "<recalibrated>"
  # TEI（text-embeddings-inference）容器内监听 80——compose 的 `8001:80`
  # 是宿主机映射；集群内 Service 端口按 TEI 默认 80 对接（勿写 8080）
  RERANK_ENDPOINT_URL: "http://reranker:80/rerank"
  ES_URL: "http://elasticsearch:9200"
  # ---- shared writable state (Deployment + evolution CronJob) ----
  # The image runs as appuser and its /app tree is root-owned/read-only at runtime.
  # Keep every mutable or cross-pod path on the RWX PVC.
  KB_DIR: /kb-shared/kb
  SESSION_PATH: /kb-shared/sessions/session.json
  SESSION_DIR: /kb-shared/sessions
  MEMORY_DIR: /kb-shared/memory
  KB_INDEX_PATH: /kb-shared/kb_index.json
  CHROMA_PERSIST_DIR: /kb-shared/chroma
  KB_GENERATION_PATH: /kb-shared/kb_generations.json
  KB_UPLOAD_TMP_DIR: /kb-shared/uploads
  KB_UPLOAD_ORIGINAL_DIR: /kb-shared/originals
  KB_UPLOAD_STAGING_DIR: /kb-shared/kb/.staging
  KB_UPLOADS_DIR: /kb-shared/kb/uploads
  KB_UPLOAD_TRASH_DIR: /kb-shared/kb/.trash
  EVOLVE_TURNS_DIR: /kb-shared/evolution/turns
  EVOLVE_STATE_DIR: /kb-shared/evolution/state
  EVOLVE_OUTPUT_DIR: /kb-shared/evolution/output
  EVAL_OUTPUT_DIR: /kb-shared/evolution/eval
  # ---- 状态外置 ----
  SESSION_STORE_BACKEND: redis
  REDIS_URL: "redis://redis-master:6379/0"
  REDIS_REQUIRED: "true"
  SESSION_LOCK_TTL_SECONDS: "300"
  MEMORY_CONSOLIDATE_EVERY: "10"
  MEMORY_CONSOLIDATE_IDLE_MINUTES: "30"
  MEMORY_CONSOLIDATE_SCAN_MINUTES: "5"
  # ---- 上下文 256k：份额受 token_budget.CAP_* 收敛（dialog ≤65536）----
  CONTEXT_WINDOW_TOKENS: "262144"
  SUMMARY_MAX_CHARS: "600"
  # ---- 对象存储：分片/原件走 S3（MinIO/OSS 兼容）----
  KB_UPLOAD_STORAGE: s3
  TURNS_ARCHIVE_BACKEND: s3
  S3_BUCKET: ecom
  S3_ENDPOINT_URL: "http://minio:9000"
  # ---- 安全（生产全开）----
  AUTH_ENABLED: "true"
  ENFORCE_ORDER_OWNERSHIP: "true"
  OPS_RBAC_REQUIRED: "true"
  GUARDRAILS_ENABLED: "true"
  # ---- 自进化：正式发布默认关闭（先人工审核）----
  SELF_EVOLVE_ENABLED: "false"
  EVOLVE_CAPTURE_ENABLED: "true"
  HUMAN_QA_EVOLUTION_ENABLED: "false"
  HUMAN_CONVERSATION_RETENTION_DAYS: "180"
  # ---- 数据库 ----
  DB_URL: "mysql+pymysql://ecom:ecom@mysql:3306/ecom?charset=utf8mb4"
  APP_ENV: prod
  KB_WRITE_LOCK_BACKEND: mysql
  # 第一阶段保持同步；第二阶段通过 kb_control.kb_async_enabled upsert 切换为异步。
  KB_ASYNC_API: "false"

envFromSecret: "ecom-agent-secrets"

# 生产必填 existingSecret（外部提供）；Chart 不创建 REPLACE_ME
secret:
  create: false
  data: {}

# 生产显式启用两个独立 Worker；强制跨 hostname 调度，保证节点级容灾。
kbWorker:
  enabled: true
  replicaCount: 2
  podAntiAffinity:
    required: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

kbSharedVolume:
  enabled: true
  storageClass: standard
  size: 20Gi
  mountPath: /kb-shared
  accessModes: ["ReadWriteMany"]
  srcPath: /app/app/agent/rag/knowledge

# 显式安全默认；启用链路时同时打开 HUMAN_QA_EVOLUTION_ENABLED，发布还需
# SELF_EVOLVE_ENABLED=true。发布 Worker 两副本、每实例串行，写锁保证单写。
humanEvalCron:
  enabled: false

humanPublishWorker:
  enabled: false
  replicaCount: 2
  terminationGracePeriodSeconds: 120
  podAntiAffinity:
    required: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

evolutionJob:
  enabled: true
  schedule: "30 3 * * *"
  dryRun: true   # 安全默认：预览；正式发布审核通过后显式 false + args

migration:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2
